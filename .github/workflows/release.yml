name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-go:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            arch: amd64
          - os: ubuntu-latest
            goos: linux
            arch: arm64
          - os: ubuntu-latest
            goos: darwin
            arch: amd64
          - os: ubuntu-latest
            goos: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        working-directory: lsp-bridge
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.arch }} go build -o atmos-lsp-bridge-${{ matrix.goos }}-${{ matrix.arch }} .
      - uses: actions/upload-artifact@v4
        with:
          name: atmos-lsp-bridge-${{ matrix.goos }}-${{ matrix.arch }}
          path: lsp-bridge/atmos-lsp-bridge-*

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Build WASM
        run: cargo build --target wasm32-wasip2
      - uses: actions/upload-artifact@v4
        with:
          name: extension-wasm
          path: target/wasm32-wasip2/debug/zed_atmos_language.wasm

  release:
    needs: [build-go, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            atmos-lsp-bridge-*/atmos-lsp-bridge-*
            extension-wasm/zed_atmos_language.wasm
          fail_on_unmatched_files: false
